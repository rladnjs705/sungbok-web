<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>필리핀 선교 - 성복교회</title>
  <link rel="stylesheet" href="../css/hero-modern.css">
  <style>.breadcrumb{max-width:1200px;margin:2rem auto;padding:0 2rem;font-size:0.875rem;color:var(--church-text-light)}.breadcrumb a{color:var(--church-primary);text-decoration:none}.mission-hero{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:4rem 2rem;text-align:center;color:white}.mission-hero h1{font-size:3rem;font-weight:700;margin-bottom:1rem}.mission-hero .country-flag{font-size:4rem;margin-bottom:1rem}.mission-container{max-width:1200px;margin:0 auto;padding:4rem 2rem}.mission-card{background:white;border:1px solid var(--church-border);border-radius:8px;padding:3rem;margin-bottom:3rem}.mission-card h2{font-size:2rem;font-weight:700;color:var(--church-primary);margin-bottom:1.5rem;border-bottom:2px solid var(--church-border);padding-bottom:1rem}.mission-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin:2rem 0}.stat-box{text-align:center;padding:2rem;background:var(--church-bg-light);border-radius:8px}.stat-number{font-size:3rem;font-weight:700;color:var(--church-primary)}.back-button{text-align:center;margin-top:4rem}.back-button a{display:inline-block;padding:1rem 3rem;background:var(--church-primary);color:white;text-decoration:none;border-radius:4px;font-weight:600}</style>
</head>
<body>
  <header class="header"><div class="header-container"><a href="../index.html" class="logo" style="text-decoration: none; font-size: 1.5rem; font-weight: 700; color: #469CDE;">성복교회</a></nav></div></header>
  <div class="breadcrumb"><a href="../index.html">홈</a> &gt; <a href="../mission.html">선교·사역</a> &gt; <strong>필리핀 선교</strong></div>
  <section class="mission-hero">
    <div class="country-flag">🇵🇭</div>
    <h1>필리핀 선교</h1>
    <p style="font-size:1.25rem;opacity:0.95;">Philippines Mission Field</p>
  </section>
  <div class="mission-container">
    <div class="mission-card">
      <h2>선교 현황</h2>
      <div class="mission-stats">
        <div class="stat-box"><div class="stat-number">2</div><div class="stat-label">파송 선교사</div></div>
        <div class="stat-box"><div class="stat-number">3</div><div class="stat-label">협력 교회</div></div>
        <div class="stat-box"><div class="stat-number">8</div><div class="stat-label">사역 연수</div></div>
      </div>
      <p style="font-size:1.125rem;line-height:1.8;margin-top:2rem;">성복교회는 필리핀에서 교회 개척, 교육 사역, 구제 사역을 펼치고 있습니다.</p>
    </div>
    <div class="mission-card">
      <h2>주요 사역</h2>
      <p style="font-size:1rem;line-height:1.7;">• 교회 개척 및 목회자 양성<br>• 빈민 지역 교육 사역<br>• 의료 및 구제 사역</p>
    </div>
    <div class="back-button"><a href="../mission.html">선교·사역 목록으로</a></div>
  </div>
  <footer class="footer"><div class="footer-container"><div class="footer-bottom"><p>&copy; 2024 성복교회</p></div></div></footer>
</body>
</html>
