# Testcontainers with Podman Configuration
# PostgreSQL Integration Test Profile

# DataSource (PostgreSQL 명시적 설정)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway (Testcontainers에서는 비활성화 - create-drop 사용)
spring.flyway.enabled=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.testcontainers=INFO

# Testcontainers (Podman)
# 환경 변수로 설정: DOCKER_HOST, TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE
