# OAuth2 Configuration - 성복교회
# ⚠️ 중요: 실제 키는 환경변수로 설정하세요!

spring:
  security:
    oauth2:
      client:
        registration:
          # 구글 로그인
          google:
            client-id: ${GOOGLE_CLIENT_ID:temp-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:temp-google-client-secret}
            scope: 
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            
          # 네이버 로그인
          naver:
            client-id: ${NAVER_CLIENT_ID:temp-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:temp-naver-client-secret}
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            
          # 카카오 로그인
          kakao:
            client-id: ${KAKAO_CLIENT_ID:temp-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:temp-kakao-client-secret}
            scope:
              - profile_nickname
              - account_email
              - profile_image
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        
        provider:
          # 네이버는 별도 provider 설정 필요
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          
          # 카카오는 별도 provider 설정 필요
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 설정
jwt:
  # 반드시 환경변수로 설정! (Base64 인코딩된 256비트 키)
  # openssl rand -base64 48
  secret: ${JWT_SECRET:dGVtcC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtbWluaW11bS00OC1jaGFyYWN0ZXJzLWFyZS1yZXF1aXJlZC1mb3ItSFMyNTY=}
  
  # 토큰 수명 설정
  access:
    expiration: 900000        # ✅ 15분 (밀리초)
  refresh:
    expiration: 1209600000    # ✅ 2주 (밀리초) = 14일

# 프론트엔드 URL (CORS, 리다이렉트용)
frontend:
  url: ${FRONTEND_URL:http://localhost:3001}
