spring:
  application:
    name: sungbok-church-backend
  
  # OAuth 설정 import (application-oauth.yml)
  config:
    import: classpath:application-oauth.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/sungbok_church
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      connection-timeout: 30000  # 30초
      idle-timeout: 600000       # 10분
      max-lifetime: 1800000      # 30분
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false  # 프로덕션: SQL 로깅 비활성화
    properties:
      hibernate:
        format_sql: false  # 프로덕션: SQL 포맷팅 비활성화
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Redis Cache Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m

server:
  port: 8080

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.sungbok.church: INFO  # DEBUG → INFO
    org.springframework.web: WARN  # INFO → WARN
    org.hibernate.SQL: WARN  # DEBUG → WARN (프로덕션)

# JWT Configuration
jwt:
  # Base64 인코딩된 256비트 키 (운영 환경에서는 반드시 환경변수로 설정)
  # openssl rand -base64 48
  secret: ${JWT_SECRET:dGVtcC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtbWluaW11bS00OC1jaGFyYWN0ZXJzLWFyZS1yZXF1aXJlZC1mb3ItSFMyNTY=}
  expiration: 86400000  # 24 hours in milliseconds

# YouTube API Configuration
youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    channel-id: ${YOUTUBE_CHANNEL_ID}
    base-url: https://www.googleapis.com/youtube/v3
    max-results: 50
  sync:
    enabled: true
    live-check-interval: 60000  # 1분
    video-sync-cron: "0 0 * * * *"  # 매시간
    playlist-sync-cron: "0 0 */6 * * *"  # 6시간마다
  quota:
    daily-limit: 10000
    warning-threshold: 8000  # 80%

# Cloudflare R2 Configuration (S3-compatible Storage)
r2:
  # R2 API Endpoint
  # https://<account-id>.r2.cloudflarestorage.com
  endpoint: ${R2_ENDPOINT:https://your-account.r2.cloudflarestorage.com}
  access-key: ${R2_ACCESS_KEY:your-access-key}
  secret-key: ${R2_SECRET_KEY:your-secret-key}
  bucket: ${R2_BUCKET:sungbok-church-files}
  # Public URL for file access (Custom domain or R2.dev subdomain)
  # Example: https://cdn.sungbok.church OR https://pub-your-id.r2.dev
  public-url: ${R2_PUBLIC_URL:https://pub-your-id.r2.dev}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    display-operation-id: false
  show-actuator: false
