spring:
  application:
    name: sungbok-church-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sungbok_church
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      connection-timeout: 30000  # 30초
      idle-timeout: 600000       # 10분
      max-lifetime: 1800000      # 30분
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false  # 프로덕션: SQL 로깅 비활성화
    properties:
      hibernate:
        format_sql: false  # 프로덕션: SQL 포맷팅 비활성화
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Redis Cache Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m

server:
  port: 8080

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true

logging:
  level:
    com.sungbok.church: INFO  # DEBUG → INFO
    org.springframework.web: WARN  # INFO → WARN
    org.hibernate.SQL: WARN  # DEBUG → WARN (프로덕션)

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

# YouTube API Configuration
youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    channel-id: ${YOUTUBE_CHANNEL_ID}
    base-url: https://www.googleapis.com/youtube/v3
    max-results: 50
  sync:
    enabled: true
    live-check-interval: 60000  # 1분
    video-sync-cron: "0 0 * * * *"  # 매시간
    playlist-sync-cron: "0 0 */6 * * *"  # 6시간마다
  quota:
    daily-limit: 10000
    warning-threshold: 8000  # 80%

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    display-operation-id: false
  show-actuator: false
