# Valkey Configuration (Redis-compatible)
spring:
  data:
    redis:
      host: localhost
      port: 6379
      # Valkey 9.0.1 서버 연결 설정
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10분 (밀리초)
      cache-null-values: false
      key-prefix: "church:"
      use-key-prefix: true

# YouTube API 캐시 TTL 설정
youtube:
  cache:
    videos-ttl: 3600        # 1시간
    channel-ttl: 7200       # 2시간
    live-ttl: 60            # 1분
    playlist-ttl: 3600      # 1시간
