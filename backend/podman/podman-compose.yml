version: '3.8'

services:
  postgres:
    image: postgres:18.1
    container_name: sungbok-postgres
    environment:
      POSTGRES_DB: sungbok_church
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - sungbok-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: bitnami/valkey:latest
    container_name: sungbok-valkey
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "6379:6379"
    networks:
      - sungbok-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: podman/Containerfile
    container_name: sungbok-backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # Database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sungbok_church
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # JWT (Base64 encoded 256-bit key)
      # openssl rand -base64 48
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtbWluaW11bS00OC1jaGFyYWN0ZXJzLWZvci1IUzI1Ni1hbGdvcml0aG0=

      # Cloudflare R2 (File Storage)
      R2_ENDPOINT: https://ae0ae9316f064cf9a5a10592af41411f.r2.cloudflarestorage.com
      R2_ACCESS_KEY: 4979f67ac8f333a643115e1b471ccc64
      R2_SECRET_KEY: b997a9df3211f67d16668e0a5c5bb0bcb02f3ba1b6f90c86c51f8e7b94b5f750
      R2_BUCKET: sungbok-church-files
      R2_PUBLIC_URL: https://pub-ae0ae9316f064cf9a5a10592af41411f.r2.dev

      # YouTube API (optional for testing)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-dummy-api-key}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-dummy-channel-id}

      # Valkey (Redis-compatible)
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_SUNGBOK_CHURCH: DEBUG
      LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

      # Server Port
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - sungbok-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 2G

  frontend:
    image: node:24-alpine
    container_name: sungbok-frontend
    working_dir: /app
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8081/api
      NODE_ENV: development
      PORT: 3001
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
    ports:
      - "3001:3001"
    networks:
      - sungbok-network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: sungbok-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - sungbok-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jenkins:
    image: jenkins/jenkins:lts-jdk25
    container_name: sungbok-jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ../../:/workspace
      - ../../jenkins-config/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.DefaultCrumbIssuer.EXCLUDE_SESSION_ID=true
      - JENKINS_URL=http://localhost:8082
    networks:
      - sungbok-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  jenkins_data:
  pnpm_store:

networks:
  sungbok-network:
    driver: bridge
